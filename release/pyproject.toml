[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "net-defense-ops-console"
version = "1.1.0"
description = "Net-defense operations console simulation (visual only, no network activity)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hacker Screen contributors" }]
keywords = ["simulation", "dashboard", "customtkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
net-defense-console = "hacker_screen.main:main"

[tool.setuptools.packages.find]
where = ["../app/src"]

[tool.setuptools.package-data]
"hacker_screen" = ["assets/**"]
